<title>Lumora</title>

<style>
/* Layout: iOS conventions (Apple's public Human Interface Guidelines).
   Library: large title, edge-to-edge 3-column grid. Editor: black surface, photo
   full width, one adjustment chosen from a row of round buttons and set with a
   tick ruler. Sheets: iOS action sheets and modal sheets. Brand: Lumora board
   (Obsidian, Graphite, Silver, Pearl White, Aurora Violet, Icy Blue; Inter;
   thin wide wordmark). The aurora gradient is used sparingly: value rings, the
   ruler pointer, the selected button's glow and the main button. Icons are our
   own drawings (undo/redo arrows: Lucide, ISC licence). */
:root {
  color-scheme: dark;
  /* roles from replica/design/tokens.json (Lumora brand board) */
  --bg: #0b0c0f;            /* Obsidian */
  --surface: #1f2228;       /* Graphite */
  --surface-2: #2a2e36;
  --separator: #3a3f4a;     /* decorative hairlines only */
  --text: #f7f8fa;          /* Pearl White */
  --text-silver: #c9cdd6;   /* Silver */
  --text-muted: #9aa0ac;
  --accent: #a78bfa;        /* Aurora Violet: tint for icons and text buttons */
  --accent-2: #7dd3fc;      /* Icy Blue: second stop of the aurora gradient */
  --on-accent: #0b0c0f;
  --danger: #ff7a70;
  --aurora: linear-gradient(135deg, var(--accent), var(--accent-2));
  --glow: 0 0 0 1px rgb(167 139 250 / .55), 0 0 18px rgb(167 139 250 / .35), 0 0 32px rgb(125 211 252 / .18);
  --material: rgb(31 34 40 / .78);
  --scrim: rgb(0 0 0 / .5);
  --icon-shadow: drop-shadow(0 1px 2px rgb(0 0 0 / .6));
  --scale-cool: #5b8fd6;
  --scale-warm: #d9b44a;
  --scale-green: #6fb36a;
  --scale-magenta: #c46fc0;
  --font: Inter, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 17px/22px var(--font); letter-spacing: -0.011em; font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: manipulation;
}
button, label.btn-fill, label.nav-btn { font: inherit; letter-spacing: inherit; }
button { color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round; flex: none; }
.view { height: 100%; display: grid; min-height: 0; }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: fade .18s ease-out; }
  .sheet { animation: rise .26s cubic-bezier(.2, .8, .2, 1); }
  .scrim { animation: fade .2s ease-out; }
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }

/* navigation bars */
.nav { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.nav-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 4px; }
.nav-actions { display: flex; align-items: center; gap: 2px; margin-right: -10px; }
.nav-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px;
  color: var(--accent); cursor: pointer; }
.nav-btn.text { gap: 2px; margin-left: -8px; padding-right: 4px; font-size: 17px; }
.nav-btn[disabled] { color: var(--text-muted); opacity: .55; cursor: default; }
.large-title { margin: 6px 0 0; line-height: 0; }
.wordmark { display: block; height: 26px; width: auto; max-width: 100%; color: var(--text); }
.tagline { margin: 10px 0 4px; font-size: 13px; line-height: 18px; font-weight: 300; letter-spacing: .14em; color: var(--text-silver); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.footnote { margin: 0; font-size: 13px; line-height: 18px; color: var(--text-muted); letter-spacing: 0; }
.footnote.warn { color: var(--danger); }

/* library */
#library { grid-template-rows: auto 1fr auto; }
#library .nav { padding-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; align-content: start;
  overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }
.tile { position: relative; display: block; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--surface); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .fmt { position: absolute; left: 6px; bottom: 5px; font-size: 11px; line-height: 13px; font-weight: 600;
  letter-spacing: .02em; color: var(--text); text-shadow: 0 1px 2px rgb(0 0 0 / .7); }
.tile .edited { position: absolute; right: 5px; bottom: 4px; width: 16px; height: 16px; color: var(--text);
  stroke-width: 2.2; filter: var(--icon-shadow); }
.tile:focus-visible { outline-offset: -2px; border-radius: 0; }

.empty { grid-column: 1 / -1; display: grid; justify-items: center; text-align: center; gap: 10px;
  padding-block: 64px 32px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.empty .art { width: 64px; height: 64px; color: var(--text-muted); stroke-width: 1.4; }
.empty h2 { margin: 6px 0 0; font-size: 20px; line-height: 25px; font-weight: 600; }
.empty p { margin: 0 0 10px; max-width: 30ch; font-size: 15px; line-height: 20px; color: var(--text-muted); }
.btn-fill { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 22px;
  border-radius: 12px; background: var(--aurora); color: var(--on-accent); font-weight: 600; cursor: pointer;
  box-shadow: 0 6px 24px rgb(167 139 250 / .25); }
.btn-fill.block { width: 100%; }
.btn-fill[disabled] { opacity: .5; }
.btn-text { min-height: 44px; padding: 0 8px; color: var(--accent); font-size: 17px; }

/* editor */
#editor { grid-template-rows: auto 1fr auto auto; }
.stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; }
.clip { position: absolute; overflow: hidden; }
.clip.open { overflow: visible; }
.clip canvas { position: absolute; display: block; transform-origin: 50% 50%; max-width: none; }

/* crop frame: drag inside to move, corners and edges to resize; outside is dimmed */
.crop-frame { position: absolute; border: 1px solid rgb(247 248 250 / .9); box-shadow: 0 0 0 9999px rgb(11 12 15 / .62);
  touch-action: none; cursor: move; z-index: 2; }
.crop-frame.dragging { box-shadow: 0 0 0 9999px rgb(11 12 15 / .4); }
.crop-frame .grid3 { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .15s;
  background:
    linear-gradient(90deg, transparent calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
    linear-gradient(180deg, transparent calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
.crop-frame.dragging .grid3 { opacity: 1; }
.crop-frame .h { position: absolute; width: 24px; height: 24px; border: 0 solid var(--text); }
.crop-frame .h::after, .crop-frame .e::after { content: ""; position: absolute; inset: -14px; }
.crop-frame .nw { left: -4px; top: -4px; border-left-width: 4px; border-top-width: 4px; cursor: nwse-resize; }
.crop-frame .ne { right: -4px; top: -4px; border-right-width: 4px; border-top-width: 4px; cursor: nesw-resize; }
.crop-frame .sw { left: -4px; bottom: -4px; border-left-width: 4px; border-bottom-width: 4px; cursor: nesw-resize; }
.crop-frame .se { right: -4px; bottom: -4px; border-right-width: 4px; border-bottom-width: 4px; cursor: nwse-resize; }
.crop-frame .e { position: absolute; }
.crop-frame .n, .crop-frame .s { left: 30px; right: 30px; height: 2px; cursor: ns-resize; }
.crop-frame .n { top: -1px; } .crop-frame .s { bottom: -1px; }
.crop-frame .ee, .crop-frame .w { top: 30px; bottom: 30px; width: 2px; cursor: ew-resize; }
.crop-frame .ee { right: -1px; } .crop-frame .w { left: -1px; }
.stage .badge { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 4px 10px;
  border-radius: 999px; background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); font-size: 12px; line-height: 16px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; }
.stage .loading { position: absolute; color: var(--text-muted); font-size: 15px; }

.controls { display: grid; justify-items: center; gap: 2px; padding-block: 10px 14px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.adj-name { margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted); }
.adj-value { margin: 0; min-height: 24px; font-size: 20px; line-height: 24px; font-weight: 500;
  font-variant-numeric: tabular-nums; letter-spacing: 0; }
.adj-value.zero { color: var(--text-muted); }
.ruler { display: block; width: 100%; max-width: 560px; height: 44px; touch-action: none; cursor: ew-resize;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.scale { width: 100%; max-width: 560px; height: 3px; border-radius: 2px; margin-top: -2px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.scale.temp { background: linear-gradient(90deg, var(--scale-cool), var(--text-muted) 50%, var(--scale-warm)); }
.scale.tint { background: linear-gradient(90deg, var(--scale-green), var(--text-muted) 50%, var(--scale-magenta)); }
.scale.none { visibility: hidden; }

/* full-bleed row; spacers let the first and last button reach the centre */
.adj-row { display: flex; align-items: center; gap: 14px; justify-self: stretch; margin-top: 8px;
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block: 4px; }
.adj-row::before, .adj-row::after { content: ""; flex: 0 0 calc(50% - 40px); }
.adj-row::-webkit-scrollbar { display: none; }
.adj-group { display: flex; gap: 14px; }
.adj { position: relative; flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%; display: grid;
  place-items: center; color: var(--text-muted); scroll-snap-align: center; }
.adj .ring { position: absolute; inset: 0; width: 52px; height: 52px; transform: rotate(-90deg); pointer-events: none; }
.ring .track { fill: none; stroke: var(--separator); stroke-width: 1.5; }
.ring .arc { fill: none; stroke: url(#aurora); stroke-width: 2.5; stroke-linecap: round; }
.adj[aria-checked="true"] { color: var(--text); background: var(--surface); box-shadow: var(--glow); }
.adj.auto[aria-pressed="true"] { color: var(--accent); }
.adj.auto[aria-pressed="true"] .ring .track { stroke: url(#aurora); stroke-width: 2.5; }
.adj:focus-visible { border-radius: 50%; }

/* crop tools row */
.crop-row { display: flex; align-items: center; gap: 8px; justify-self: stretch; margin-top: 10px;
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 4px 6px;
  overflow-x: auto; scrollbar-width: none; }
.crop-row::-webkit-scrollbar { display: none; }
.tool { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  color: var(--text); background: var(--surface); }
.vsep { flex: none; width: 1px; height: 24px; background: var(--separator); margin-inline: 2px; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--separator);
  color: var(--text-silver); font-size: 15px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--aurora); border-color: transparent; color: var(--on-accent); font-weight: 600; }
.crop-row .btn-text { flex: none; }

/* mode bar: Ajustar / Recortar */
.modebar { display: flex; justify-content: center; gap: 10px; padding-block: 4px 6px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.mode { display: grid; justify-items: center; gap: 3px; min-width: 84px; padding: 7px 12px 6px; border-radius: 14px;
  color: var(--text-muted); font-size: 11px; line-height: 13px; font-weight: 500; letter-spacing: .01em; }
.mode svg.i { width: 22px; height: 22px; }
.mode[aria-selected="true"] { color: var(--text); background: var(--surface); box-shadow: inset 0 0 0 1px rgb(167 139 250 / .35); }
.mode[aria-selected="true"] svg { color: var(--accent); }

/* presets row */
.preset-row { display: flex; align-items: flex-start; gap: 10px; justify-self: stretch; margin-top: 8px;
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 6px 4px;
  overflow-x: auto; scrollbar-width: none; }
.preset-row::-webkit-scrollbar { display: none; }
.ptile { flex: none; display: grid; justify-items: center; gap: 6px; width: 70px; color: var(--text-muted);
  font-size: 11px; line-height: 13px; font-weight: 500; text-align: center; -webkit-touch-callout: none; user-select: none; }
.ptile canvas, .ptile .addbox { display: block; width: 64px; height: 64px; border-radius: 12px; background: var(--surface); }
.ptile span { max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptile[aria-pressed="true"] { color: var(--text); }
.ptile[aria-pressed="true"] canvas { box-shadow: var(--glow); }
.ptile .addbox { display: grid; place-items: center; background: transparent; border: 1.5px dashed var(--separator); color: var(--accent); }
.preset-row .vsep { align-self: center; margin-top: -18px; height: 40px; }

/* library selection */
.tile .check { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--text); background: rgb(11 12 15 / .35); display: none; }
.selecting .tile .check { display: block; }
.tile.sel .check { border-color: transparent; background: var(--aurora); }
.tile.sel .check::after { content: ""; position: absolute; left: 7px; top: 3.5px; width: 5px; height: 10px;
  border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.tile.sel img { opacity: .78; }
.select-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: var(--material);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--separator); }
.select-bar .btn-fill { min-height: 44px; padding: 0 18px; font-size: 16px; }

/* form parts inside sheets */
.field { display: grid; gap: 6px; }
.field label, .field-label { margin: 0; font-size: 13px; line-height: 18px; color: var(--text-muted); letter-spacing: 0; }
.field input { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--separator);
  background: var(--surface-2); color: var(--text); font: inherit; font-size: 17px; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.list { background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 14px; }
.switch-row + .switch-row { border-top: 1px solid var(--separator); }
.switch-row span small { display: block; font-size: 13px; line-height: 16px; color: var(--text-muted); }
.switch { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 51px; height: 31px; margin: 0;
  border-radius: 16px; background: var(--separator); cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: var(--text); box-shadow: 0 2px 4px rgb(0 0 0 / .35); transition: transform .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--surface-2); }
.seg button { flex: 1; min-height: 32px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--text-silver);
  font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--separator); color: var(--text); font-weight: 600; }
.sheet-nav .btn-text.left { justify-self: start; margin-left: -8px; margin-right: 0; }
.sheet-nav .btn-text.strong { font-weight: 600; }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; }
.sheet.action { display: grid; gap: 8px; padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin-inline: auto; }
.group { background: var(--surface); border-radius: 14px; overflow: hidden; }
.group .msg { margin: 0; padding: 14px 16px; text-align: center; font-size: 13px; line-height: 18px;
  color: var(--text-muted); border-bottom: 1px solid var(--separator); letter-spacing: 0; }
.group .msg strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
.as-btn { display: block; width: 100%; min-height: 57px; font-size: 20px; line-height: 24px; color: var(--accent); }
.as-btn + .as-btn { border-top: 1px solid var(--separator); }
.as-btn.danger { color: var(--danger); }
.as-btn.cancel { font-weight: 600; }
.sheet.modal { display: grid; gap: 14px; background: var(--surface); border-radius: 12px 12px 0 0;
  padding-top: 6px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-height: 92%; overflow-y: auto; }
.grabber { justify-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--separator); }
.sheet-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
.sheet-nav h2 { margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; text-align: center; }
.sheet-nav .btn-text { justify-self: end; margin-right: -8px; }
.sheet.modal img { max-width: 100%; max-height: 46vh; justify-self: center; border-radius: 10px; -webkit-touch-callout: default; }
.facts { margin: 0; text-align: center; font-size: 13px; line-height: 18px; color: var(--text-muted);
  font-variant-numeric: tabular-nums; letter-spacing: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px));
  z-index: 30; max-width: calc(100% - 48px); padding: 10px 16px; border-radius: 999px; text-align: center;
  background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  font-size: 15px; line-height: 20px; }
</style>

<section id="library" class="view" aria-label="Fotos">
  <header class="nav">
    <div class="nav-row">
      <span></span>
      <div class="nav-actions">
      <button id="selectBtn" class="btn-text" type="button" hidden>Seleccionar</button>
      <label class="nav-btn" for="pick" aria-label="Añadir fotos" role="button" tabindex="0">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </label>
      </div>
      <input id="pick" type="file" accept="image/jpeg,image/heic,image/heif,.jpg,.jpeg,.heic,.heif" multiple hidden>
    </div>
    <h1 class="large-title"><span class="sr-only">Lumora</span>

  const ps = Array.from(ys, (y) => Math.pow(y * k, 1 / 2.2)).sort((a, b) => a - b);
  const pct = (f) => ps[Math.min(ps.length - 1, Math.floor(f * ps.length))];
  const over = ps.filter((p) => p > 1).length / ps.length;
  const deep = ps.filter((p) => p < .15).length / ps.length;
  return {
    ...DEFAULTS,
    exposure: Number(ev.toFixed(2)),
    contrast: 10,
    highlights: over > .005 ? -Math.round(clamp(over * 600, 15, 70)) : 0,
    shadows: Math.round(clamp(deep * 120, 0, 45)),
    whites: Math.round(clamp((.97 - Math.min(pct(.995), 1.2)) * 250, -40, 50)),
    blacks: Math.round(clamp((.025 - pct(.005)) * 300, -35, 25)),
    vibrance: 12,
    temp: state.settings.temp, tint: state.settings.tint, saturation: state.settings.saturation,
    crop: { ...state.settings.crop }, preset: state.settings.preset ? { ...state.settings.preset } : null,
  };
}

/* ---------- crop: geometry ----------
   Screen pipeline for the canvas (the adjusted, un-oriented preview):
   flip -> rotate by rot -> straighten by angle (CSS: rotate(rot + angle) scaleX(flip)).
   The crop is an axis-aligned rectangle in that rotated space, centred on the image centre,
   and must stay inside the rotated image. */
const rad = (deg) => deg * Math.PI / 180;
const oriented = (w, h, rot) => (rot % 180 ? [h, w] : [w, h]);
function cropPx(c = state.settings.crop) {
  const [W, H] = oriented(state.src.width, state.src.height, c.rot);
  return { cx: c.cx * W, cy: c.cy * H, w: c.w * W, h: c.h * H, W, H };
}
function toNorm(r, W, H) { return { cx: r.cx / W, cy: r.cy / H, w: r.w / W, h: r.h / H }; }
function insideImage(r, W, H, angle, minSize = 0) {
  if (r.w < minSize - 1e-6 || r.h < minSize - 1e-6) return false;
  const cs = Math.cos(rad(angle)), sn = Math.sin(rad(angle)), hw = W / 2 + .5, hh = H / 2 + .5;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const x = r.cx + sx * r.w / 2, y = r.cy + sy * r.h / 2;
    if (Math.abs(x * cs + y * sn) > hw || Math.abs(-x * sn + y * cs) > hh) return false;
  }
  return true;
}
// largest rectangle of ratio a (w / h) centred in the rotated image
function maxCentred(a, W, H, angle) {
  const cs = Math.abs(Math.cos(rad(angle))), sn = Math.abs(Math.sin(rad(angle)));
  const h = Math.min(W / (a * cs + sn), H / (a * sn + cs)) * .9999;
  return { cx: 0, cy: 0, w: a * h, h };
}
const lerpRect = (a, b, t) => ({ cx: a.cx + (b.cx - a.cx) * t, cy: a.cy + (b.cy - a.cy) * t, w: a.w + (b.w - a.w) * t, h: a.h + (b.h - a.h) * t });
// from a valid rectangle towards a wanted one, as far as it stays valid
function furthest(from, to, ok) {
  if (ok(to)) return to;
  let lo = 0, hi = 1;
  for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (ok(lerpRect(from, to, m))) lo = m; else hi = m; }
  return lerpRect(from, to, lo);
}
function setCrop(c, { commitNow = false } = {}) {
  state.settings.crop = c;
  layout(); syncControls(); scheduleSave();
  if (commitNow) commit();
}
function setAngle(v) {
  const c = { ...state.settings.crop, angle: v };
  const p = cropPx(c), r = { cx: p.cx, cy: p.cy, w: p.w, h: p.h };
  let out = r;
  if (!insideImage(r, p.W, p.H, v)) {
    const base = maxCentred(c.aspect || r.w / r.h, p.W, p.H, v);
    out = furthest(base, r, (q) => insideImage(q, p.W, p.H, v));
  }
  setCrop({ ...c, ...toNorm(out, p.W, p.H) });
}

/* ---------- crop: what is on screen ---------- */
const stage = $('#stage'), clip = $('#clip'), frame = $('#cropFrame');
function layout() {
  if (!state.src) return;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (!sw || !sh) return;
  const c = state.settings.crop, p = cropPx(), srcW = state.src.width, srcH = state.src.height, cropMode = state.mode === 'crop';
  let k, box, cX, cY;
  if (cropMode) {
    const m = 28;
    k = Math.min((sw - 2 * m) / p.W, (sh - 2 * m) / p.H);
    box = { l: 0, t: 0, w: sw, h: sh }; cX = sw / 2; cY = sh / 2;
  } else {
    k = Math.min(sw / p.w, sh / p.h);
    box = { w: p.w * k, h: p.h * k }; box.l = (sw - box.w) / 2; box.t = (sh - box.h) / 2;
    cX = box.w / 2 - p.cx * k; cY = box.h / 2 - p.cy * k;
  }
  Object.assign(clip.style, { left: box.l + 'px', top: box.t + 'px', width: box.w + 'px', height: box.h + 'px' });
  clip.classList.toggle('open', cropMode);
  Object.assign(canvas.style, { width: srcW * k + 'px', height: srcH * k + 'px', left: cX - srcW * k / 2 + 'px', top: cY - srcH * k / 2 + 'px',
    transform: `rotate(${c.rot + c.angle}deg) scaleX(${c.flip ? -1 : 1})` });
  state.view = { k };
  frame.hidden = !cropMode;
  if (cropMode) Object.assign(frame.style, { left: sw / 2 + (p.cx - p.w / 2) * k + 'px', top: sh / 2 + (p.cy - p.h / 2) * k + 'px',

/* ---------- crop: the frame (move, resize from corners and edges) ---------- */
let cdrag = null;
function resized(st, h, dx, dy, a) {
  let l = st.cx - st.w / 2, r = st.cx + st.w / 2, t = st.cy - st.h / 2, b = st.cy + st.h / 2;
  if (h === 'move') return { cx: st.cx + dx, cy: st.cy + dy, w: st.w, h: st.h };
  if (h.includes('w')) l += dx; if (h.includes('e')) r += dx;
  if (h.includes('n')) t += dy; if (h.includes('s')) b += dy;
  let w = Math.max(1, r - l), hh = Math.max(1, b - t);
  if (a) {
    if (h === 'n' || h === 's') w = hh * a;
    else if (h === 'e' || h === 'w') hh = w / a;
    else if (w / hh > a) w = hh * a; else hh = w / a;
    // keep the opposite side or corner where it was; edges stay centred on the other axis
    if (h.includes('w')) l = r - w; else if (h.includes('e')) r = l + w; else { l = st.cx - w / 2; r = l + w; }
    if (h.includes('n')) t = b - hh; else if (h.includes('s')) b = t + hh; else { t = st.cy - hh / 2; b = t + hh; }
  } else { w = r - l; hh = b - t; }
  return { cx: (l + r) / 2, cy: (t + b) / 2, w, h: hh };
}
frame.addEventListener('pointerdown', (e) => {

  const ok = (q) => insideImage(q, p.W, p.H, c.angle, min);

const chips = $('#chips');

/* ---------- copy and paste adjustments ---------- */
const CLIP_KEY = 'lumora.clipboard';
try { const c = JSON.parse(localStorage.getItem(CLIP_KEY) || 'null'); if (c && c.groups) state.clipboard = c; } catch (e) {}
function copyFrom(s, groups) {
  const clip = { groups, light: {}, color: {}, preset: null, crop: null };
  for (const d of SLIDERS) if (groups[d.group]) clip[d.group][d.key] = s[d.key];
  if (groups.preset) clip.preset = s.preset ? { ...s.preset } : null;
  if (groups.crop) clip.crop = { ...s.crop };
  return clip;
}
// pure: keep a pasted crop inside a photo of this size
function fitCrop(c, srcW, srcH) {
  const [W, H] = oriented(srcW, srcH, c.rot);
  let r = { cx: c.cx * W, cy: c.cy * H, w: c.w * W, h: c.h * H };
  if (c.aspect) {   // a locked proportion must survive a photo of another shape
    const w = Math.min(r.w, r.h * c.aspect);
    r = { cx: r.cx, cy: r.cy, w, h: w / c.aspect };
  }
  if (insideImage(r, W, H, c.angle)) return { ...c, ...toNorm(r, W, H) };
  const base = maxCentred(c.aspect || r.w / r.h, W, H, c.angle);
  return { ...c, ...toNorm(furthest(base, r, (q) => insideImage(q, W, H, c.angle)), W, H) };
}

  const out = clone(s);
  for (const d of SLIDERS) if (clip.groups[d.group] && typeof clip[d.group][d.key] === 'number') out[d.key] = clip[d.group][d.key];
  if (clip.groups.preset) out.preset = clip.preset ? { ...clip.preset } : null;
  if (clip.groups.crop && clip.crop) out.crop = fitCrop({ ...clip.crop }, w, h);
  return out;
}

// a photo that is not open: decode, render a new thumbnail, store

  const small = rasterize(img, tw, th); done();
  const off = document.createElement('canvas'); const r = new Renderer(off, true);
  r.setImage(small); r.draw(effective(settings));

}
$('#selectBtn').addEventListener('click', () => setSelecting(!state.selecting));
$('#pasteSelBtn').addEventListener('click', async () => {
  const ids = new Set(state.selected), btn = $('#pasteSelBtn'); btn.disabled = true;
  await pasteToPhotos(ids); setSelecting(false); renderLibrary();
});

/* ---------- modes: Ajustar / Presets / Recortar ---------- */
function setMode(m) {
  state.mode = m;
  $('#mode-adjust').setAttribute('aria-selected', m === 'adjust' ? 'true' : 'false');
  $('#mode-crop').setAttribute('aria-selected', m === 'crop' ? 'true' : 'false');
  $('#mode-presets').setAttribute('aria-selected', m === 'presets' ? 'true' : 'false');
  $('#adjRow').hidden = m !== 'adjust'; $('#cropRow').hidden = m !== 'crop'; $('#presetRow').hidden = m !== 'presets';
  if (m === 'presets') buildPresetRow();
  if (state.orig) showOrig(false);
  layout(); syncControls();
  if (m === 'adjust') { const b = document.getElementById('adj-' + state.adj); if (b) b.scrollIntoView({ inline: 'center', block: 'nearest' }); }
}
$('#mode-adjust').addEventListener('click', () => setMode('adjust'));
$('#mode-crop').addEventListener('click', () => setMode('crop'));
$('#mode-presets').addEventListener('click', () => setMode('presets'));

/* ---------- output: apply crop, rotation, flip and straighten to a rendered canvas ---------- */
function renderCropped(adj, c) {
  const sW = adj.width, sH = adj.height, [W, H] = oriented(sW, sH, c.rot);
  const w = Math.max(1, Math.round(c.w * W)), h = Math.max(1, Math.round(c.h * H));
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const g = out.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.translate(w / 2 - c.cx * W, h / 2 - c.cy * H);
  g.rotate(rad(c.rot + c.angle)); g.scale(c.flip ? -1 : 1, 1);
  g.drawImage(adj, -sW / 2, -sH / 2);
  return out;
}

/* ---------- open / leave the editor ---------- */
const showOrig = (on) => { state.orig = on; $('#origBadge').hidden = !on; requestDraw(); };
stage.addEventListener('pointerdown', (e) => { if (state.mode !== 'crop' && (e.target === canvas || e.target === clip)) showOrig(true); });
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => stage.addEventListener(t, () => state.orig && showOrig(false)));
stage.addEventListener('contextmenu', (e) => e.preventDefault());

async function openEditor(p) {
  state.photo = p; state.changed = false; state.autoPrev = null;
  const edit = p.sample ? null : await store.get('edits', p.id);
  state.settings = fromStored(edit && edit.settings);
  resetHistory(); state.mode = 'adjust'; state.src = null;
  $('#library').hidden = true; $('#editor').hidden = false;
  setMode('adjust'); sizeRuler(); selectAdj(state.adj, false);
  document.getElementById('adj-' + state.adj).scrollIntoView({ inline: 'center', block: 'nearest' });
  $('#loading').hidden = false; canvas.hidden = true;
  try {
    const { img, done } = await decode(p.original);
    const [w, h] = fit(img.naturalWidth, img.naturalHeight, PREVIEW_EDGE, PREVIEW_PX);
    state.src = rasterize(img, w, h); done();
    ensureRenderer().setImage(state.src);
    canvas.hidden = false; layout(); syncControls(); requestDraw();
    if (once('revelado.hint.hold')) toast('Mantén pulsada la foto para ver el antes', 3500);
  } catch (err) {
    toast(err && err.message === 'webgl' ? 'Este navegador no puede mostrar la edición (falta WebGL2).' : 'Esta foto no se pudo abrir.', 5000);
  } finally { $('#loading').hidden = true; }
}
async function refreshThumb() {
  const p = state.photo;
  if (!p || p.sample || !state.changed || !state.src) return;
  try {
    const [tw, th] = fit(state.src.width, state.src.height, 480, Infinity);
    const small = rasterize(state.src, tw, th);
    const off = document.createElement('canvas'); const r = new Renderer(off, true);
    r.setImage(small); r.draw(effective(state.settings));
    const c = state.settings.crop, outCanvas = cropIsIdentity(c) ? off : renderCropped(off, c);
    p.thumb = await toBlob(outCanvas, 'image/jpeg', .8); r.dispose();
    await store.put('photos', p);
  } catch (e) { /* keep the old thumbnail */ }
}
async function leaveEditor() {
  await save(); await refreshThumb();
  state.photo = null; state.src = null;
  $('#editor').hidden = true; $('#library').hidden = false;
  renderLibrary();
}
$('#back').addEventListener('click', leaveEditor);
const flush = () => { if (state.saveTimer) save(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);

/* ---------- more: photo info and remove (iOS action sheet) ---------- */
$('#moreBtn').addEventListener('click', () => {
  const p = state.photo; if (!p) return;
  openSheet('action', (sh) => {
    const msg = el('p', { className: 'msg' }, [el('strong', { textContent: p.fileName }),
      `${p.width} × ${p.height} · ${megapixels(p.width, p.height)} · ${/hei/i.test(p.mime) ? 'HEIC' : 'JPG'}`]);
    const top = el('div', { className: 'group' }, [msg,
      el('button', { className: 'as-btn', type: 'button', textContent: 'Copiar ajustes', onclick: () => { closeSheet(); openCopySheet(); } })]);
    if (state.clipboard) top.append(el('button', { className: 'as-btn', type: 'button', textContent: 'Pegar ajustes', onclick: () => { closeSheet(); pasteHere(); } }));
    if (!p.sample) {
      top.append(el('button', { className: 'as-btn danger', type: 'button', textContent: 'Quitar del editor', onclick: async () => {
        closeSheet();
        clearTimeout(state.saveTimer); state.saveTimer = 0; state.changed = false;
        await store.removePhoto(p.id);
        state.photo = null; state.src = null;
        $('#editor').hidden = true; $('#library').hidden = false;
        toast('Quitada de Lumora. La original sigue en tu carrete.'); renderLibrary();
      } }));
    }
    sh.append(top, el('div', { className: 'group' }, [el('button', { className: 'as-btn cancel', type: 'button', textContent: 'Cancelar', onclick: closeSheet })]));
  });
});

/* ---------- export (modal sheet) ---------- */
const SIZES = [['Máximo', 0], ['4096', 4096], ['2048', 2048], ['1080', 1080]];
const QUALITIES = [['Alta', .92], ['Media', .8], ['Ligera', .65]];
function exportPrefs() {
  try { const v = JSON.parse(localStorage.getItem('lumora.export') || 'null'); if (v) return v; } catch (e) {}
  return { size: 0, quality: .92 };
}
function seg(options, current, onPick) {
  const box = el('div', { className: 'seg', role: 'group' });
  for (const [label, val] of options) {
    const b = el('button', { type: 'button', textContent: label });
    b.setAttribute('aria-pressed', val === current ? 'true' : 'false');
    b.addEventListener('click', () => { for (const x of box.children) x.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-pressed', 'true'); onPick(val); });
    box.append(b);
  }
  return box;
}
$('#exportBtn').addEventListener('click', () => {
  if (!state.photo) return;
  const prefs = exportPrefs();
  openSheet('modal', (sh) => {
    const go = el('button', { className: 'btn-fill block', type: 'button', textContent: 'Exportar foto' });
    sh.append(el('div', { className: 'grabber' }),
      sheetNav('Exportar', null, el('button', { className: 'btn-text', type: 'button', textContent: 'Cerrar', onclick: closeSheet })),
      el('p', { className: 'field-label', textContent: 'Tamaño (lado largo, en píxeles)' }), seg(SIZES, prefs.size, (v) => { prefs.size = v; }),
      el('p', { className: 'field-label', textContent: 'Calidad JPG' }), seg(QUALITIES, prefs.quality, (v) => { prefs.quality = v; }),
      go, el('p', { className: 'facts', textContent: 'Sin ubicación ni datos de la cámara.' }));
    go.addEventListener('click', () => {
      try { localStorage.setItem('lumora.export', JSON.stringify(prefs)); } catch (e) {}
      closeSheet(); doExport(prefs.size, prefs.quality);
    });
  });
});
async function doExport(limit, quality) {
  const p = state.photo; if (!p) return;
  const btn = $('#exportBtn'); btn.disabled = true;
  toast('Preparando la foto…', 60000);
  try {
    await save();
    const { img, done } = await decode(p.original);
    const off = document.createElement('canvas'); const r = new Renderer(off, true);
    const [w, h] = fit(img.naturalWidth, img.naturalHeight, Math.min(r.maxTex, 8192), EXPORT_PX);
    let src = rasterize(img, w, h); done();
    r.setImage(src); r.draw(effective(state.settings));
    const c = state.settings.crop;
    let outCanvas = cropIsIdentity(c) ? off : renderCropped(off, c);
    if (limit && Math.max(outCanvas.width, outCanvas.height) > limit) {
      const [sw2, sh2] = fit(outCanvas.width, outCanvas.height, limit, Infinity);
      const scaled = rasterize(outCanvas, sw2, sh2);
      if (outCanvas !== off) outCanvas.width = outCanvas.height = 0;
      outCanvas = scaled;
    }
    const blob = await toBlob(outCanvas, 'image/jpeg', quality);
    const ow = outCanvas.width, oh = outCanvas.height;
    r.dispose(); src.width = src.height = 0; src = null;
    if (outCanvas !== off) { outCanvas.width = outCanvas.height = 0; } outCanvas = null;
    $('#toast').hidden = true;
    showExport(blob, baseName(p.fileName) + '-lumora.jpg', ow, oh, !limit && img.naturalWidth * img.naturalHeight > w * h);
  } catch (err) {
    toast('No se pudo exportar. Cierra otras apps y vuelve a intentarlo.', 5000);
  } finally { btn.disabled = false; }
}
function showExport(blob, name, w, h, reduced) {
  const file = new File([blob], name, { type: 'image/jpeg' });
  const url = URL.createObjectURL(blob);
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  openSheet('modal', (sh) => {
    const img = el('img', { src: url, alt: 'Foto exportada' }); img.dataset.url = url;
    sh.append(
      el('div', { className: 'grabber' }),
      el('div', { className: 'sheet-nav' }, [el('span'), el('h2', { textContent: 'Exportar' }),
        el('button', { className: 'btn-text', type: 'button', textContent: 'Cerrar', onclick: closeSheet })]),
      img,
      el('p', { className: 'facts', textContent: `${w} × ${h} · ${megapixels(w, h)} · JPG · ${fileSize(blob.size)} · sin ubicación` }),
    );
    if (canShare) {
      sh.append(el('button', { className: 'btn-fill block', type: 'button', textContent: 'Guardar en Fotos o compartir', onclick: async () => {
        try { await navigator.share({ files: [file] }); closeSheet(); }
        catch (e) { if (e && e.name !== 'AbortError') toast('No se abrió el menú de compartir. Mantén pulsada la imagen y elige «Guardar en Fotos».', 6000); }
      } }));
    }
    sh.append(el('p', { className: 'facts', textContent: (canShare ? 'Elige «Guardar imagen» para llevarla a Fotos, o ' : '') +
      (canShare ? 'mantén pulsada la imagen.' : 'Mantén pulsada la imagen y elige «Guardar en Fotos».') +
      (reduced ? ' Reducida a 16 MP por el límite de memoria de Safari.' : '') }));
  });
}

/* ---------- start ---------- */
(async () => {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  await store.open();
  try { state.userPresets = (await store.all('presets')).sort((a, b) => a.createdAt.localeCompare(b.createdAt)); } catch (e) { state.userPresets = []; }
  selectAdj(state.adj, false);
  renderLibrary();
})();
})();
</script>
