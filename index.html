<style>
/* Lumora 2.0 design system.
   Guided by Apple's public Human Interface Guidelines (materials, Liquid Glass, typography,
   layout, accessibility); no Apple assets are used. Brand: Obsidian, Graphite, Pearl White,
   Aurora Violet, Icy Blue. The aurora gradient is kept for what is active or primary:
   the ruler needle, value rings, the selected look and the main action. Glass is used only
   for floating controls, never stacked on glass, so the photo stays first. */
:root, body.in-editor {
  color-scheme: dark;
  --bg: #08090C;              /* Obsidian */
  --bg-raised: #111317;
  --surface: #1F2228;         /* Graphite */
  --surface-2: #2A2E36;
  --fill: rgb(247 248 250 / .08);
  --fill-strong: rgb(247 248 250 / .14);
  --separator: rgb(247 248 250 / .12);
  --text: #F7F8FA;            /* Pearl White */
  --text-2: #C9CDD6;
  --text-muted: #9AA0AC;
  --accent: #A78BFA;          /* Aurora Violet */
  --accent-2: #7DD3FC;        /* Icy Blue */
  --accent-text: #B9A3FF;
  --on-accent: #08090C;
  --danger: #FF7A70;
  --success: #6FD3A0;
  --glass: rgb(28 30 36 / .56);
  --glass-solid: #1B1D22;
  --glass-edge: rgb(255 255 255 / .13);
  --glass-hi: rgb(255 255 255 / .22);
  --glass-shadow: 0 12px 32px rgb(0 0 0 / .36), 0 2px 6px rgb(0 0 0 / .28);
  --tile-bg: #15171B;
  --scrim: rgb(0 0 0 / .46);
  --sheet-bg: #17191E;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F7F8FA; --bg-raised: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEF0F4;
    --fill: rgb(8 9 12 / .05); --fill-strong: rgb(8 9 12 / .09); --separator: rgb(8 9 12 / .1);
    --text: #08090C; --text-2: #2B2F37; --text-muted: #5E6470;
    --accent-text: #6A4FE0; --danger: #D93A2F; --success: #15955C;
    --glass: rgb(255 255 255 / .64); --glass-solid: #FFFFFF; --glass-edge: rgb(8 9 12 / .08);
    --glass-hi: rgb(255 255 255 / .9); --glass-shadow: 0 10px 30px rgb(30 34 50 / .14), 0 1px 3px rgb(30 34 50 / .1);
    --tile-bg: #E6E8ED; --scrim: rgb(8 9 12 / .28); --sheet-bg: #F7F8FA;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F7F8FA; --bg-raised: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEF0F4;
  --fill: rgb(8 9 12 / .05); --fill-strong: rgb(8 9 12 / .09); --separator: rgb(8 9 12 / .1);
  --text: #08090C; --text-2: #2B2F37; --text-muted: #5E6470;
  --accent-text: #6A4FE0; --danger: #D93A2F; --success: #15955C;
  --glass: rgb(255 255 255 / .64); --glass-solid: #FFFFFF; --glass-edge: rgb(8 9 12 / .08);
  --glass-hi: rgb(255 255 255 / .9); --glass-shadow: 0 10px 30px rgb(30 34 50 / .14), 0 1px 3px rgb(30 34 50 / .1);
  --tile-bg: #E6E8ED; --scrim: rgb(8 9 12 / .28); --sheet-bg: #F7F8FA;
}
:root {
  --aurora: linear-gradient(135deg, #A78BFA, #7DD3FC);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
  --spring: cubic-bezier(.32, .72, 0, 1);          /* iOS sheet-like settle */
  --bounce: cubic-bezier(.34, 1.4, .64, 1);        /* light overshoot for press release */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: .16s; --t-med: .28s; --t-slow: .44s;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-reduced-motion: reduce) { :root { --t-fast: 0s; --t-med: 0s; --t-slow: 0s; } }
/* Dynamic Type on iOS: text in the library and sheets follows the reader's text size */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 1rem; line-height: 1.3; letter-spacing: -0.012em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: manipulation; overflow: hidden;
}
button, input, label.btn { font: inherit; letter-spacing: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* icons: one 24 pt grid, 1.75 stroke, round caps and joins */
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round; flex: none; overflow: visible; }
svg.i.sm { width: 20px; height: 20px; }
svg.i.xs { width: 16px; height: 16px; stroke-width: 2; }

/* Liquid Glass: blur, light translucency, a soft specular edge and depth */
.glass {
  position: relative; background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-edge);
}
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(180deg, var(--glass-hi), transparent 38%, transparent 70%, rgb(255 255 255 / .06));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--glass-solid); } }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (prefers-contrast: more) { .glass { background: var(--glass-solid); box-shadow: var(--glass-shadow), inset 0 0 0 1px var(--text-muted); } }

/* press feedback: quick in, springy out */
.press { transition: transform var(--t-med) var(--bounce), background-color var(--t-fast), color var(--t-fast), opacity var(--t-fast); }
.press:active:not(:disabled) { transform: scale(.92); transition-duration: .08s; }

.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--text); }
.round:disabled { color: var(--text-muted); opacity: .5; }
.capsule { display: flex; align-items: center; border-radius: 999px; }
.capsule .round { background: transparent; box-shadow: none; }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px;
  border-radius: 999px; font-weight: 600; font-size: 1.0625rem; cursor: pointer; white-space: nowrap; user-select: none; -webkit-user-select: none; }
.btn.primary { background: var(--aurora); color: var(--on-accent); box-shadow: 0 8px 24px rgb(140 120 250 / .28); }
.btn.secondary { background: var(--fill-strong); color: var(--text); }
.btn.plain { min-height: 44px; padding: 0 12px; color: var(--accent-text); font-weight: 500; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; box-shadow: none; }
.btn.small { min-height: 36px; padding: 0 16px; font-size: .9375rem; }
.spinner { width: 20px; height: 20px; border-radius: 50%; flex: none;
  background: conic-gradient(from 90deg, transparent 0 20%, currentColor); -webkit-mask: radial-gradient(circle, transparent 55%, #000 58%); mask: radial-gradient(circle, transparent 55%, #000 58%);
  animation: spin .8s linear infinite; }
.spinner.aurora { width: 34px; height: 34px; background: conic-gradient(from 90deg, transparent 0 15%, #A78BFA 60%, #7DD3FC); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* ---------- views ---------- */
.view { position: fixed; inset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .view.enter { animation: viewIn var(--t-slow) var(--spring); }
  .ed-chrome.enter { animation: chromeIn .5s var(--spring) both; }
  .ed-chrome.enter.late { animation-delay: .06s; }
}
@keyframes viewIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes chromeIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

/* ---------- library ---------- */
#library { background: var(--bg); }
.lib-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding-bottom: calc(110px + var(--safe-b)); }
.lib-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 4; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: calc(var(--safe-t) + 4px) var(--gutter-r) 6px var(--gutter-l); min-height: calc(var(--safe-t) + 54px);
  transition: background-color var(--t-med), box-shadow var(--t-med); }
.lib-bar .small-title { grid-column: 2; font-weight: 600; font-size: 1.0625rem; letter-spacing: .32em; padding-left: .32em; opacity: 0; transform: translateY(4px);
  transition: opacity var(--t-med), transform var(--t-med) var(--spring); }
.lib-bar .bar-end { grid-column: 3; justify-self: end; display: flex; gap: 8px; }
.lib-bar.scrolled { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 -.5px 0 var(--separator); }
.lib-bar.scrolled .small-title { opacity: 1; transform: none; }
@media (prefers-reduced-transparency: reduce) { .lib-bar.scrolled { background: var(--bg-raised); -webkit-backdrop-filter: none; backdrop-filter: none; } }
.lib-bar .round { background: var(--fill); }
.lib-head { padding: calc(var(--safe-t) + 58px) var(--gutter-r) 0 var(--gutter-l); }
.wordmark { display: block; height: 30px; width: auto; max-width: 100%; color: var(--text); overflow: visible; }
.wordmark .o { stroke: url(#auroraMark); }
.tagline { margin: 12px 0 0; font-size: .8125rem; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: var(--text-muted); }
.lib-meta { display: grid; justify-items: start; gap: 12px; margin: 18px 0 14px; }
.count { margin: 0; font-size: .875rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.count.warn { color: var(--danger); }
.segmented { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--fill); flex: none; }
.segmented button { min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: .8125rem; font-weight: 500; color: var(--text-muted);
  transition: background-color var(--t-med) var(--spring), color var(--t-fast), box-shadow var(--t-med); white-space: nowrap; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgb(0 0 0 / .16); }
:root:not([data-theme="light"]) .segmented button[aria-pressed="true"] { background: var(--surface-2); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .segmented button[aria-pressed="true"] { background: #fff; } }
.section-title { margin: 6px var(--gutter-r) 10px var(--gutter-l); font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
.recents { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 0 var(--gutter-r) 22px var(--gutter-l); scroll-snap-type: x proximity;
  scroll-padding-inline: var(--gutter-l); }
.recents::-webkit-scrollbar { display: none; }
.rtile { position: relative; flex: none; width: 112px; height: 112px; border-radius: var(--r-md); overflow: hidden; background: var(--tile-bg); scroll-snap-align: start; }
.rtile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rtile .when { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 6px; font-size: .6875rem; font-weight: 600; color: #fff;
  background: linear-gradient(transparent, rgb(0 0 0 / .55)); text-align: left; letter-spacing: 0; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(7, 1fr); } }
.tile, .rtile, .ptile { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.tile { position: relative; display: block; aspect-ratio: 1; overflow: hidden; background: var(--tile-bg); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--t-med) var(--spring), opacity var(--t-fast); }
.tile:active img { transform: scale(.96); }
.tile:focus-visible { outline-offset: -3px; border-radius: 0; }
.badges { position: absolute; left: 6px; right: 6px; bottom: 5px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; color: #fff; }
.badges svg { width: 16px; height: 16px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .6)); }
.badges .fav { fill: #fff; stroke: none; }
.badges .hei { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-shadow: 0 1px 2px rgb(0 0 0 / .7); }
.tile .check { position: absolute; right: 7px; top: 7px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff;
  background: rgb(0 0 0 / .22); box-shadow: 0 1px 3px rgb(0 0 0 / .35); display: none; place-items: center; color: var(--on-accent); }
.selecting .tile .check { display: grid; }
.tile.sel .check { border-color: transparent; background: var(--aurora); }
.tile .check svg { width: 14px; height: 14px; stroke-width: 2.6; opacity: 0; transform: scale(.4); transition: transform var(--t-med) var(--bounce), opacity var(--t-fast); }
.tile.sel .check svg { opacity: 1; transform: none; }
.tile.sel img { opacity: .72; transform: scale(.94); }
.empty-filter { grid-column: 1 / -1; padding: 56px var(--gutter-r) 24px var(--gutter-l); text-align: center; color: var(--text-muted); font-size: .9375rem; }
.empty-filter svg { width: 40px; height: 40px; stroke-width: 1.4; margin-bottom: 10px; }

/* onboarding */
.onboard { padding: 28px var(--gutter-r) 24px var(--gutter-l); display: grid; gap: 22px; max-width: 520px; }
.onboard .hero { position: relative; height: 210px; border-radius: var(--r-xl); overflow: hidden;
  background: radial-gradient(120% 90% at 20% 0%, rgb(167 139 250 / .5), transparent 60%), radial-gradient(100% 90% at 100% 100%, rgb(125 211 252 / .42), transparent 60%), var(--surface-2); }
.onboard .hero .frame { position: absolute; inset: 24px 40px; border-radius: 18px; background: linear-gradient(180deg, #2d3e5e, #a7787a 55%, #e7a865);
  box-shadow: 0 18px 40px rgb(0 0 0 / .32); overflow: hidden; }
.onboard .hero .frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(180deg, #5b4a57, #211f26); clip-path: polygon(0 40%, 18% 18%, 36% 36%, 58% 6%, 78% 30%, 100% 14%, 100% 100%, 0 100%); }
.onboard .hero .sun { position: absolute; right: 28%; bottom: 36%; width: 34px; height: 34px; border-radius: 50%; background: #ffe2ae; z-index: 1; }
.onboard .hero .dial { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; font-size: .75rem; font-weight: 600;
  color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.onboard h2 { margin: 0; font-size: 1.75rem; line-height: 1.15; font-weight: 700; letter-spacing: -.025em; }
.onboard p.lead { margin: 8px 0 0; color: var(--text-muted); font-size: 1rem; line-height: 1.4; }
.features { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.features li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; font-size: .9375rem; line-height: 1.35; color: var(--text-2); }
.features li .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--fill); color: var(--accent-text); }
.features strong { display: block; color: var(--text); font-weight: 600; }
.onboard .actions { display: grid; gap: 6px; }

/* floating library toolbar */
.lib-dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: center; pointer-events: none;
  padding: 0 var(--gutter-r) calc(max(12px, var(--safe-b)) + 4px) var(--gutter-l); }
.dock { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; max-width: 100%; }
.dock .btn.plain { color: var(--text); }
.dock .btn.primary { min-height: 46px; padding: 0 20px 0 16px; }
.dock .sel-count { padding: 0 10px; font-size: .9375rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dock .round:disabled { opacity: .35; }
.dock .danger { color: var(--danger); }

/* ---------- editor ---------- */
#editor { background: #000; }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #000; }
.clip { position: absolute; overflow: hidden; transform-origin: 50% 50%; will-change: transform; }
.clip.open { overflow: visible; }
.clip.anim { transition: transform var(--t-slow) var(--spring); }
.clip canvas { position: absolute; display: block; transform-origin: 50% 50%; max-width: none; }
.clip canvas.fade { pointer-events: none; transition: opacity .26s ease-out; }
.hero-img { position: fixed; z-index: 15; object-fit: cover; pointer-events: none; transform-origin: 0 0; border-radius: 0; will-change: transform, opacity; }

/* crop frame: drag inside to move, corners and edges to resize; outside is dimmed */
.crop-frame { position: absolute; border: 1px solid rgb(247 248 250 / .9); box-shadow: 0 0 0 9999px rgb(8 9 12 / .66);
  touch-action: none; cursor: move; z-index: 2; transition: box-shadow var(--t-med); }
.crop-frame.dragging { box-shadow: 0 0 0 9999px rgb(8 9 12 / .42); }
.crop-frame .grid3 { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .15s;
  background:
    linear-gradient(90deg, transparent calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
    linear-gradient(180deg, transparent calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% - .5px), rgb(247 248 250 / .45) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% - .5px), rgb(247 248 250 / .45) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
.crop-frame.dragging .grid3, .crop-frame.straighten .grid3 { opacity: 1; }
.crop-frame .h { position: absolute; width: 22px; height: 22px; border: 0 solid var(--text); }
.crop-frame .h::after, .crop-frame .e::after { content: ""; position: absolute; inset: -14px; }
.crop-frame .nw { left: -3px; top: -3px; border-left-width: 3px; border-top-width: 3px; border-top-left-radius: 2px; cursor: nwse-resize; }
.crop-frame .ne { right: -3px; top: -3px; border-right-width: 3px; border-top-width: 3px; border-top-right-radius: 2px; cursor: nesw-resize; }
.crop-frame .sw { left: -3px; bottom: -3px; border-left-width: 3px; border-bottom-width: 3px; border-bottom-left-radius: 2px; cursor: nesw-resize; }
.crop-frame .se { right: -3px; bottom: -3px; border-right-width: 3px; border-bottom-width: 3px; border-bottom-right-radius: 2px; cursor: nwse-resize; }
.crop-frame .e { position: absolute; }
.crop-frame .n, .crop-frame .s { left: 30px; right: 30px; height: 2px; cursor: ns-resize; }
.crop-frame .n { top: -1px; } .crop-frame .s { bottom: -1px; }
.crop-frame .ee, .crop-frame .w { top: 30px; bottom: 30px; width: 2px; cursor: ew-resize; }
.crop-frame .ee { right: -1px; } .crop-frame .w { left: -1px; }
.stage-chip { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3; padding: 6px 12px; border-radius: 999px;
  font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text); white-space: nowrap; }
.stage-chip.zoom { text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.stage-chip.side { transform: none; left: auto; text-transform: uppercase; }
.split { position: absolute; z-index: 4; width: 44px; margin-left: -22px; touch-action: none; cursor: ew-resize; display: grid; place-items: center; }

.tabbar { display: flex; gap: 2px; padding: 4px; border-radius: 999px; position: relative; max-width: 620px; }

  color: var(--text-muted); font-size: 10.5px; line-height: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  transition: color var(--t-med), transform var(--t-med) var(--bounce); }
.tab svg.i { width: 22px; height: 22px; }

.tab:active { transform: scale(.94); transition-duration: .08s; }

  .panel { grid-template-rows: 40px 44px 88px; padding-top: 6px; }

  .tabbar { width: 100%; }
}

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; opacity: 0; transition: opacity var(--t-med) ease-out; }

.list { background: var(--fill); border-radius: var(--r-md); overflow: hidden; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 14px; }

.switch-row span small { display: block; font-size: .8125rem; line-height: 1.3; color: var(--text-muted); }
.switch { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 51px; height: 31px; margin: 0; border-radius: 16px; background: var(--fill-strong);
  cursor: pointer; transition: background var(--t-fast); }

  transition: transform var(--t-med) var(--spring); }

.seg { display: flex; padding: 2px; border-radius: 12px; background: var(--fill); }

<section id="library" class="view" aria-labelledby="libTitle">

    </div>

    const off = document.createElement('canvas'); const r = new Renderer(off, true);
    const [w, h] = fit(img.naturalWidth, img.naturalHeight, Math.min(r.maxTex, 8192), EXPORT_PX);
    let src = rasterize(img, w, h); done();
    r.setImage(src); r.draw(effective(state.settings));
    const c = state.settings.crop;
    let outCanvas = cropIsIdentity(c) ? off : renderCropped(off, c);
    if (limit && Math.max(outCanvas.width, outCanvas.height) > limit) {
      const [sw2, sh2] = fit(outCanvas.width, outCanvas.height, limit, Infinity);
      const scaled = rasterize(outCanvas, sw2, sh2);
      if (outCanvas !== off) outCanvas.width = outCanvas.height = 0;
      outCanvas = scaled;
    }
    const blob = await toBlob(outCanvas, 'image/jpeg', quality);
    const ow = outCanvas.width, oh = outCanvas.height;
    r.dispose(); src.width = src.height = 0; src = null;
    if (outCanvas !== off) { outCanvas.width = outCanvas.height = 0; } outCanvas = null;
    return { blob, name: baseName(p.fileName) + '-lumora.jpg', w: ow, h: oh, reduced: !limit && img.naturalWidth * img.naturalHeight > w * h };
  } catch (err) {
    toast(t('exportFail'), 5000, 'err');
    return null;
  } finally { btn.disabled = false; }
}
function showExportResult({ blob, name, w, h, reduced }) {
  const file = new File([blob], name, { type: 'image/jpeg' });
  const url = URL.createObjectURL(blob);
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  const img = el('img', { src: url, alt: name }); img.dataset.url = url;
  const done = el('span', { className: 'done', ariaHidden: 'true' }, [icon('check')]);
  const dl = el('a', { className: 'btn ' + (canShare ? 'plain' : 'primary') + ' block press', href: url, download: name }, [t('download')]);
  sheetEl.replaceChildren(el('div', { className: 'grabber' }), sheetNav(t('exportReady'), null, textBtn(t('done'), closeSheet, 'strong')),
    el('div', { className: 'ex-preview' }, [img, done]),
    el('p', { className: 'facts big', textContent: `${w} × ${h} · ${megapixels(w, h)} · JPG · ${fileSize(blob.size)}` }));
  sheetEl.querySelector('h2').id = 'sheetTitle';
  if (canShare) {
    const share = el('button', { className: 'btn primary block press', type: 'button' }, [icon('share', 'i sm'), t('saveShare')]);
    share.addEventListener('click', async () => {
      try { await navigator.share({ files: [file] }); }
      catch (e) { if (e && e.name !== 'AbortError') toast(t('shareFail'), 6000, 'err'); }
    });
    sheetEl.append(share);
  }
  sheetEl.append(dl, el('p', { className: 'facts', textContent: [canShare ? t('holdToSave') : t('holdOnly'), t('noMeta'), reduced ? t('reduced') : ''].filter(Boolean).join(' ') }));
  const first = sheetEl.querySelector('.btn.primary'); if (first) first.focus({ preventScroll: true });
}

(async () => {
  lang = detectLang();
  fillIcons(); applyI18n(); applyTheme();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', syncThemeColor);
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  await store.open();
  try { state.userPresets = (await store.all('presets')).sort((a, b) => a.createdAt.localeCompare(b.createdAt)); } catch (e) { state.userPresets = []; }
  selectAdj(state.adj, false);
  renderLibrary();
})();
})();
